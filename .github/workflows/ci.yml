name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Build packages for worker-build
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # .cargo/config.toml rustflags are part of the wasm build fingerprint.
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cache/worker-build
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p encode --all-targets -- -D warnings
      - run: cargo test -p encode
      - run: cargo clippy -p token-count --target wasm32-unknown-unknown -- -D warnings
      - run: pnpm test
