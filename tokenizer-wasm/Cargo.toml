[package]
name = "tokenizer-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tokenizers = { version = "0.23.2", default-features = false, features = ["unstable_wasm"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"
getrandom = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(getrandom_backend, values("custom"))'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
